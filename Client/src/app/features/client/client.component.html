<div class="layout-wrapper"
     [ngClass]="{
       'layout-static': true,
       'layout-static-inactive': staticMenuDesktopInactive,
       'layout-mobile-active': staticMenuMobileActive,
       'layout-overlay': isOverlay(),
       'layout-overlay-active': overlayMenuActive
     }">

  <!-- Topbar -->
  <div class="layout-topbar">
    <div class="layout-topbar-logo-container">
      <div class="topbar-logo-wrapper">
        <a href="/app" class="topbar-logo-link">
          <span class="logo-badge">WM</span>
          <span class="logo-text">WorkManagement</span>
        </a>
      </div>
      <div class="button-menu-wrapper">
        <a id="menu-button" href="#" (click)="onMenuButtonClick($event)"
           class="layout-topbar-action layout-menu-button"
           [ngClass]="{'menu-button-rotate': rotateMenuButton}">
          <i class="pi pi-chevron-left"></i>
        </a>
      </div>
    </div>

    <div class="layout-topbar-actions">
      <ul class="topbar-items">
        <li class="profile-item my-menu">
          <a (click)="logOut()" class="layout-topbar-action" title="Đăng xuất">
            <i class="pi pi-sign-out"></i>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="layout-sidebar">
    <p-scrollPanel [style]="{width: '100%', height: '100%'}">
      <div class="menu-scroll-content">
        <app-menu [model]="appMenuModel" basePath="/app"></app-menu>
      </div>
    </p-scrollPanel>
  </div>

  <!-- Content -->
  <div class="layout-main-container">
    <div class="layout-main">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
